<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Wireframe a Código</title>
    <style>
        /* ==========================================================================
           1. VARIABLES DE COLOR (Modifica estos valores para cambiar la paleta)
           ========================================================================== */
        :root {
            --steel-azure: #044389;      /* Azul Oscuro: Usado en topbar, texto principal y bordes */
            --canary-yellow: #FCFF4B;    /* Amarillo: Usado para el estado hover del botón Buy */
            --orange: #FFAD05;           /* Naranja: Color principal del botón Buy y acentos */
            --sky-reflection: #7CAFC4;   /* Azul Claro Grisáceo: Fondo del degradado del Hero */
            --cornflower-blue: #5995ED;  /* Azul Intermedio: Borde superior y fondo del contenedor de imagen */
            --text-dark: #1a1a1a;        /* Texto oscuro para párrafos */
            --text-light: #ffffff;       /* Texto claro para contrastes */
        }

        /* ==========================================================================
           2. ESTILOS GLOBALES Y RESETEO
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           3. BARRA SUPERIOR (Topbar: Dirección y Teléfono)
           ========================================================================== */
        .topbar {
            background-color: var(--steel-azure);
            color: var(--text-light);
            display: flex;
            justify-content: center; /* Centra los elementos horizontalmente */
            gap: 40px;               /* Espacio de separación entre dirección y teléfono */
            padding: 10px 20px;
            font-size: 0.9rem;
            border-bottom: 2px solid var(--cornflower-blue);
        }

        /* ==========================================================================
           4. BARRA DE NAVEGACIÓN (Navbar principal)
           ========================================================================== */
        .navbar {
            background-color: white;
            display: flex;
            justify-content: space-between; /* Separa el bloque izquierdo del botón "Buy" */
            align-items: center;            /* Centra verticalmente los elementos */
            padding: 15px 5%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* Contenedor que agrupa el Logo y el Menú de enlaces */
        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px; /* Espacio entre el logo y el primer enlace */
        }

        /* Componente: Logo */
        .logo {
            border: 2px solid var(--steel-azure);
            padding: 6px 20px;
            border-radius: 20px; /* Hace el borde ovalado como en el wireframe */
            font-weight: bold;
            color: var(--steel-azure);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo:hover {
            background-color: var(--steel-azure);
            color: white;
        }

        /* Lista de enlaces (Home, News, Contact, Docs) */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 20px; /* Espacio entre cada enlace */
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--steel-azure);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-menu a:hover {
            color: var(--orange); /* Cambio de color al pasar el cursor */
        }

        /* Componente: Botón de Acción (Buy) */
        .btn-buy {
            background-color: var(--orange);
            color: var(--text-dark);
            text-decoration: none;
            padding: 8px 24px;
            border-radius: 20px; /* Borde redondeado característico del wireframe */
            font-weight: bold;
            border: 2px solid var(--orange);
            transition: all 0.3s ease;
        }

        .btn-buy:hover {
            background-color: var(--canary-yellow);
            border-color: var(--canary-yellow);
        }

        /* ==========================================================================
           5. SECCIÓN HERO / SLIDER CENTRAL
           ========================================================================== */
        .hero-slider {
            position: relative;
            flex: 1; /* Ocupa todo el espacio vertical restante de la pantalla */
            display: flex;
            align-items: center;
            justify-content: space-between; /* Distribuye flechas y contenido */
            padding: 40px 5%;
            background: linear-gradient(135deg, #ffffff 0%, var(--sky-reflection) 100%);
            overflow: hidden;
        }

        /* Componente: Flechas Laterales (< y >) */
        .slider-arrow {
            background: none;
            border: none;
            font-size: 2.5rem;
            color: var(--steel-azure);
            cursor: pointer;
            padding: 10px;
            transition: transform 0.2s ease;
            z-index: 10; /* Asegura que queden por encima de otros elementos */
        }

        .slider-arrow:hover {
            transform: scale(1.2); /* Efecto de crecimiento sutil */
            color: var(--orange);
        }

        /* Contenedor del Contenido (Divide el texto de la imagen) */
        .slider-content {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Divide el espacio en dos columnas iguales */
            align-items: center;
            gap: 50px;
            width: 90%;
            margin: 0 auto;
        }

        /* Bloque Izquierdo: Textos (Título y Lorem Ipsum) */
        .hero-text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero-text h1 {
            font-size: 3rem;
            color: var(--steel-azure);
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 1.2rem;
            color: #4a4a4a;
            line-height: 1.6;
        }

        /* Bloque Derecho: Contenedor de Imagen (Marcado con la X) */
        .hero-image-container {
            position: relative;
            width: 100%;
            height: 350px;
            background-color: var(--cornflower-blue);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simulación de las líneas cruzadas (X) del wireframe mediante CSS */
        .hero-image-container::before,
        .hero-image-container::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 255, 255, 0.3);
        }
        .hero-image-container::before { transform: rotate(45deg); }
        .hero-image-container::after { transform: rotate(-45deg); }

        /* Etiqueta de texto flotante sobre la imagen */
        .hero-image-container span {
            color: white;
            font-weight: bold;
            z-index: 1;
            background: rgba(4, 67, 137, 0.8);
            padding: 8px 16px;
            border-radius: 4px;
        }

        /* Componente: Puntos de Paginación (Dots inferiores) */
        .slider-dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%); /* Centrado absoluto exacto */
            display: flex;
            gap: 12px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(4, 67, 137, 0.3); /* Punto inactivo (semitransparente) */
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background-color: var(--steel-azure); /* Punto activo (relleno por completo) */
            transform: scale(1.2);
        }

        /* ==========================================================================
           6. RESPONSIVE DESIGN (Ajustes para pantallas móviles)
           ========================================================================== */
        @media (max-width: 768px) {
            /* Pasa de 2 columnas a 1 sola columna vertical */
            .slider-content {
                grid-template-columns: 1fr;
                gap: 30px;
                text-align: center;
            }

            .hero-text h1 {
                font-size: 2.2rem;
            }

            .hero-image-container {
                height: 250px;
            }

            /* Reorganiza la navegación en formato de lista vertical */
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-left {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <span>📍 Adress: Calle 123 #45-67</span>
        <span>📞 Cellphone: +57 300 123 4567</span>
    </div>

    <nav class="navbar">
        <div class="nav-left">
            <a href="#" class="logo">Logo</a>
            
            <ul class="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">Docs</a></li>
            </ul>
        </div>
        <a href="#" class="btn-buy">Buy</a>
    </nav>

    <main class="hero-slider">
        
        <button class="slider-arrow" aria-label="Anterior">&#10094;</button>

        <div class="slider-content">
            
            <div class="hero-text">
                <h1>Titulo</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipiscing elit quisque faucibus. Proin gravida nibh vel velit auctor aliquet.</p>
            </div>
            
            <div class="hero-image-container">
                <span>Espacio para Imagen / Slider</span>
            </div>
            
        </div>

        <button class="slider-arrow" aria-label="Siguiente">&#10095;</button>

        <div class="slider-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
        
    </main>

</body>
</html>
